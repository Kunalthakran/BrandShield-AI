services:
  - type: web
    name: brandshield-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandshield-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
        
databases:
  - name: brandshield-db
    plan: free
